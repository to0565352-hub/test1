<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff8f4">
<title>Bloom — 创作者的小小宇宙</title>
<style>
:root{--bg:#fffaf7;--paper:#fff;--ink:#292522;--muted:#8c817b;--line:#eee4df;--pink:#ff6e8a;--pink2:#fff0f2;--peach:#ffb69b;--green:#b6d8c0;--shadow:0 12px 35px #60412a0b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 Inter,"PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}a{color:inherit;text-decoration:none}.app{max-width:1180px;margin:auto;padding:0 24px}.top{height:76px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);gap:20px}.brand{display:flex;align-items:center;gap:10px;font-size:23px;font-weight:850;letter-spacing:-1px}.logo{width:38px;height:38px;border-radius:14px;background:linear-gradient(145deg,#ff8ca0,#ffbd9e);display:grid;place-items:center;color:#fff;font-size:20px;box-shadow:0 6px 16px #ff81932d}.nav{display:flex;gap:7px;align-items:center}.nav button,.soft-btn{padding:10px 14px;background:transparent;border-radius:12px;color:#6e625c}.nav button.active,.nav button:hover,.soft-btn:hover{background:var(--pink2);color:#c34f69}.primary{background:var(--pink);color:#fff;border-radius:13px;padding:11px 17px;font-weight:750;box-shadow:0 6px 15px #ff6e8a2b}.primary:hover{filter:brightness(.97);transform:translateY(-1px)}.outline{border:1px solid var(--line);background:white;border-radius:12px;padding:10px 14px}.hero{padding:46px 0 30px;display:grid;grid-template-columns:1.3fr .7fr;gap:30px;align-items:center}.eyebrow{display:inline-flex;gap:8px;align-items:center;background:#fff0e9;color:#b36d52;border-radius:999px;padding:6px 12px;font-size:12px;font-weight:750}.hero h1{font-size:clamp(34px,5vw,58px);letter-spacing:-2px;line-height:1.1;margin:18px 0 15px}.hero h1 em{font-style:normal;color:var(--pink)}.hero p{max-width:570px;color:var(--muted);font-size:16px}.hero-art{min-height:240px;border-radius:30px;background:radial-gradient(circle at 68% 25%,#fff 0 5%,transparent 6%),linear-gradient(145deg,#ffe2d5,#ffdce5 56%,#e5dafa);display:grid;place-items:center;position:relative;overflow:hidden}.sun{width:140px;height:140px;border-radius:48% 52% 60% 40%;background:#fff8ee;display:grid;place-items:center;font-size:67px;box-shadow:0 20px 50px #c36c7d22;transform:rotate(-9deg)}.float{position:absolute;background:#ffffffb8;backdrop-filter:blur(6px);border:1px solid #fff;border-radius:16px;padding:9px 13px;font-size:12px;font-weight:700}.f1{left:16px;top:24px;transform:rotate(-7deg)}.f2{right:15px;bottom:27px;transform:rotate(6deg)}.section-head{display:flex;justify-content:space-between;align-items:end;gap:15px;margin:20px 0}.section-head h2{font-size:24px;letter-spacing:-.7px;margin:0}.section-head p{margin:4px 0 0;color:var(--muted);font-size:13px}.searchbar{display:flex;gap:10px;margin:20px 0}.searchbar input{flex:1}.field, input, textarea, select{width:100%;border:1px solid var(--line);border-radius:12px;background:#fff;padding:12px 14px;outline:none;color:var(--ink)}input:focus,textarea:focus,select:focus{border-color:#ff9bac;box-shadow:0 0 0 3px #ff91a31c}textarea{resize:vertical;min-height:95px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px}.card{background:var(--paper);border:1px solid var(--line);border-radius:20px;padding:19px;box-shadow:var(--shadow);min-width:0}.creator-top{display:flex;gap:12px;align-items:center}.avatar{width:52px;height:52px;border-radius:17px;background:linear-gradient(135deg,#ffe0d5,#ffd8e5);display:grid;place-items:center;font-size:25px;flex-shrink:0;overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.creator-top h3{margin:0;font-size:16px}.handle{color:var(--muted);font-size:12px}.bio{color:#766b65;font-size:13px;margin:13px 0;min-height:40px;overflow-wrap:anywhere}.tags{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}.tag{font-size:11px;background:#fff1ed;color:#b76b59;border-radius:999px;padding:4px 9px}.card-foot{border-top:1px solid #f3ece8;padding-top:13px;margin-top:13px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px}.post-card h3{margin:9px 0;font-size:17px}.post-card p{color:#776b66;white-space:pre-wrap;overflow-wrap:anywhere}.post-meta{color:var(--muted);font-size:12px}.community-card{background:linear-gradient(140deg,#fff,#fff7f2);}.community-card h3{margin:9px 0 5px}.community-card p{color:var(--muted);font-size:13px}.empty{border:1px dashed #e6d8d0;border-radius:20px;padding:35px;text-align:center;color:var(--muted);background:#fffdfb}.empty .emoji{font-size:32px}.empty h3{color:var(--ink);margin:6px}.footer{border-top:1px solid var(--line);margin-top:65px;padding:25px 0 35px;color:var(--muted);font-size:12px;display:flex;justify-content:space-between;gap:15px}.hidden{display:none!important}.page{padding:30px 0 0}.page-title{font-size:29px;letter-spacing:-1px;margin:0 0 5px}.sub{color:var(--muted);margin:0 0 24px}.two-col{display:grid;grid-template-columns:1fr 1fr;gap:18px}.form-card h3{margin:0 0 15px}.form-stack{display:grid;gap:12px}.label{display:block;font-size:12px;font-weight:750;margin:0 0 6px;color:#6e625c}.note{background:#fff7e9;border:1px solid #f3e1c2;padding:12px 14px;border-radius:13px;color:#876b3b;font-size:12px}.notice{padding:12px 14px;border-radius:12px;background:#eff9f1;color:#39794b;margin:12px 0}.error{background:#fff0f1;color:#ad4659}.profile-banner{padding:28px;border-radius:24px;background:linear-gradient(120deg,#ffe4d8,#fbe3ef,#e9e2fa);margin-bottom:20px}.profile-banner h1{margin:0}.profile-banner p{max-width:700px;color:#6e625c}.profile-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}.amounts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.amount{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px;font-weight:750}.amount.selected{border-color:var(--pink);background:var(--pink2);color:#c34f69}.modal-back{position:fixed;inset:0;background:#2c201e70;display:grid;place-items:center;padding:18px;z-index:10}.modal{background:#fffaf7;border-radius:22px;padding:24px;width:min(480px,100%);max-height:90vh;overflow:auto;box-shadow:0 25px 80px #2c201e35}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:17px}.modal-head h2{margin:0}.close{background:#f4eae5;border-radius:10px;width:35px;height:35px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.tabs button{background:#fff;border:1px solid var(--line);padding:8px 13px;border-radius:999px;color:#7a6e68}.tabs button.active{background:var(--pink2);border-color:#ffc7d0;color:#bd5368}.dash-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);padding:16px;border-radius:16px}.stat b{display:block;font-size:24px}.stat span{font-size:12px;color:var(--muted)}.record{padding:13px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}.record:last-child{border-bottom:0}.record small{display:block;color:var(--muted)}.pill{font-size:11px;padding:4px 8px;border-radius:999px;background:#fff0d9;color:#986e2b}.small{font-size:12px;color:var(--muted)}.mobile-menu{display:none}
@media(max-width:800px){.hero{grid-template-columns:1fr}.hero-art{min-height:190px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two-col{grid-template-columns:1fr}.nav button{padding:8px}.app{padding:0 16px}}
@media(max-width:560px){.top{height:auto;min-height:68px;flex-wrap:wrap;padding:12px 0}.nav{width:100%;overflow:auto;justify-content:space-between}.nav button{font-size:12px;padding:7px 9px}.grid{grid-template-columns:1fr}.hero{padding-top:28px}.hero h1{letter-spacing:-1.5px}.hero-art{min-height:160px}.dash-stats{grid-template-columns:1fr 1fr}.footer{flex-direction:column}.section-head{align-items:start;flex-direction:column}}
</style></head>
<body><div class="app">
<header class="top"><a class="brand" href="#home" aria-label="Bloom 首页"><span class="logo">✿</span><span>bloom<span style="color:var(--pink)">.</span></span></a><nav class="nav"><button data-page="home" class="active">发现</button><button data-page="posts">作品广场</button><button data-page="communities">社区</button><button data-page="dashboard">创作者工作台</button><button id="authButton" class="primary">登录 / 注册</button></nav></header>
<main id="main"></main>
<footer class="footer"><span>✿ bloom — 给创作一点养分。</span><span>创作者平台 MVP · 真实支付尚未接入</span></footer>
</div><div id="modalRoot"></div><div id="toastRoot" style="position:fixed;right:18px;bottom:18px;z-index:20;max-width:min(400px,calc(100vw - 36px))"></div>
<script>
const $=s=>document.querySelector(s);const $$=s=>[...document.querySelectorAll(s)];let me=null;let page='home';let selectedAmount=5;let cached={creators:[],posts:[],communities:[]};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const fmtDate=s=>new Date(s).toLocaleDateString('zh-CN',{year:'numeric',month:'short',day:'numeric'});const avatar=(u,size='')=>`<div class="avatar ${size}">${u?.avatar?`<img src="${esc(u.avatar)}" alt="" onerror="this.remove()">`:'🌷'}</div>`;const tags=t=>(t||[]).map(x=>`<span class="tag">#${esc(x)}</span>`).join('');
async function api(path,opts={}){const r=await fetch(path,{credentials:'same-origin',headers:{'Content-Type':'application/json',...(opts.headers||{})},...opts});let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'请求失败');return d}
function toast(msg,bad=false){const el=document.createElement('div');el.className='notice'+(bad?' error':'');el.style.boxShadow='var(--shadow)';el.textContent=msg;$('#toastRoot').append(el);setTimeout(()=>el.remove(),3600)}
function empty(title,desc,action=''){return `<div class="empty"><div class="emoji">🌱</div><h3>${esc(title)}</h3><div>${esc(desc)}</div>${action?`<div style="margin-top:16px">${action}</div>`:''}</div>`}
function creatorCard(u){return `<article class="card"><div class="creator-top">${avatar(u)}<div><h3>${esc(u.displayName)}</h3><div class="handle">@${esc(u.username)}</div></div></div><div class="bio">${esc(u.bio||'这个创作者还没有填写简介。')}</div><div class="tags">${tags(u.tags)}</div><div class="card-foot"><span>✦ ${u.postCount||0} 篇作品</span><button class="soft-btn" onclick="openCreator('${esc(u.username)}')">访问主页 ↗</button></div></article>`}
function postCard(p){return `<article class="card post-card"><div class="post-meta">${p.creator?`<a href="#creator/${esc(p.creator.username)}" onclick="openCreator('${esc(p.creator.username)}');return false">${esc(p.creator.displayName)}</a>`:'创作者'} · ${fmtDate(p.createdAt)}</div><h3>${esc(p.title)}</h3><p>${esc(p.body.length>220?p.body.slice(0,220)+'…':p.body)}</p><div class="tags">${tags(p.tags)}</div>${p.communityName?`<div class="small">发布于社区：${esc(p.communityName)}</div>`:''}</article>`}
function communityCard(c){return `<article class="card community-card"><div style="font-size:27px">✿</div><h3>${esc(c.name)}</h3><p>${esc(c.description)}</p><div class="tags">${tags(c.tags)}</div><div class="card-foot"><span>✦ ${c.postCount||0} 篇作品</span><span class="small">${c.creator?`@${esc(c.creator.username)}`:'社区'}</span></div></article>`}
async function loadHome(){const [a,b,c]=await Promise.all([api('/api/creators'),api('/api/posts'),api('/api/communities')]);cached={creators:a.creators,posts:b.posts,communities:c.communities};renderHome()}
function renderHome(){page='home';setActive();$('#main').innerHTML=`<section class="hero"><div><span class="eyebrow">✦ 一个让创作慢慢生长的地方</span><h1>让喜欢的创作，<br><em>被温柔地支持。</em></h1><p>给创作者一间自己的小屋。分享作品、找到同好、建立社区，也让每一份喜欢都有机会变成支持。</p><div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:22px"><button class="primary" onclick="startCreate()">开始创作　↗</button><button class="outline" onclick="go('posts')">逛逛作品</button></div><div class="small" style="margin-top:14px">新账号从空白开始 · 不会出现虚假的关注、点赞或评论数</div></div><div class="hero-art"><span class="float f1">✦ 创作值得被看见</span><div class="sun">🌷</div><span class="float f2">♡ little by little</span></div></section><section><div class="section-head"><div><h2>认识创作者</h2><p>找到让你心动的作品与灵感。</p></div><button class="soft-btn" onclick="go('creators')">全部创作者 →</button></div>${cached.creators.length?`<div class="grid">${cached.creators.slice(0,3).map(creatorCard).join('')}</div>`:empty('这里还很安静','成为第一个创作者，开设自己的小屋。',`<button class="primary" onclick="startCreate()">创建我的主页</button>`)}</section><section><div class="section-head"><div><h2>最近的创作</h2><p>每一篇作品，都从一次分享开始。</p></div><button class="soft-btn" onclick="go('posts')">更多作品 →</button></div>${cached.posts.length?`<div class="grid">${cached.posts.slice(0,3).map(postCard).join('')}</div>`:empty('第一篇作品还在路上','注册后发布作品，这里就会展示真实内容。',`<button class="outline" onclick="startCreate()">发布第一篇作品</button>`)}</section><section><div class="section-head"><div><h2>找到你的同好</h2><p>社区与标签相连，沿着兴趣继续探索。</p></div><button class="soft-btn" onclick="go('communities')">探索社区 →</button></div>${cached.communities.length?`<div class="grid">${cached.communities.slice(0,3).map(communityCard).join('')}</div>`:empty('还没有社区','创建一个社区，用标签把同好聚集起来。',`<button class="outline" onclick="go('communities')">看看怎么开始</button>`)}</section>`}
function setActive(){ $$('.nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page)); }
function go(p){page=p;setActive();if(p==='home')loadHome();else if(p==='posts')renderPosts();else if(p==='communities')renderCommunities();else if(p==='creators')renderCreators();else if(p==='dashboard')renderDashboard();else if(p.startsWith('creator:'))openCreator(p.slice(8));}
async function renderPosts(q=''){page='posts';setActive();const d=await api('/api/posts?q='+encodeURIComponent(q));cached.posts=d.posts;$('#main').innerHTML=`<section class="page"><h1 class="page-title">作品广场</h1><p class="sub">浏览大家正在分享的创作、想法与过程。</p><div class="searchbar"><input id="postSearch" placeholder="搜索作品、标签或社区…" value="${esc(q)}"><button class="primary" onclick="renderPosts(document.querySelector('#postSearch').value)">搜索</button>${me?`<button class="outline" onclick="openPostModal()">＋ 发布作品</button>`:''}</div>${d.posts.length?`<div class="grid">${d.posts.map(postCard).join('')}</div>`:empty('暂时没有匹配的作品','换个关键词试试，或者登录后发布第一篇作品。',me?`<button class="primary" onclick="openPostModal()">发布作品</button>`:`<button class="primary" onclick="openAuth()">登录 / 注册</button>`)}</section>`;$('#postSearch').addEventListener('keydown',e=>{if(e.key==='Enter')renderPosts(e.target.value)})}
async function renderCreators(q=''){page='creators';setActive();const d=await api('/api/creators?q='+encodeURIComponent(q));cached.creators=d.creators;$('#main').innerHTML=`<section class="page"><h1 class="page-title">创作者</h1><p class="sub">认识正在认真创作的人。</p><div class="searchbar"><input id="creatorSearch" placeholder="搜索名字、用户名或标签…" value="${esc(q)}"><button class="primary" onclick="renderCreators(document.querySelector('#creatorSearch').value)">搜索</button></div>${d.creators.length?`<div class="grid">${d.creators.map(creatorCard).join('')}</div>`:empty('没有找到创作者','试试其他关键词，或者创建自己的主页。',`<button class="primary" onclick="startCreate()">创建主页</button>`)}</section>`;$('#creatorSearch').addEventListener('keydown',e=>{if(e.key==='Enter')renderCreators(e.target.value)})}
async function renderCommunities(q=''){page='communities';setActive();const d=await api('/api/communities?q='+encodeURIComponent(q));cached.communities=d.communities;$('#main').innerHTML=`<section class="page"><div class="section-head"><div><h1 class="page-title">社区花园</h1><p class="sub" style="margin:5px 0 0">社区与标签强关联，用兴趣找到同好。</p></div>${me?'<button class="primary" onclick="openCommunityModal()">＋ 创建社区</button>':''}</div><div class="searchbar"><input id="communitySearch" placeholder="搜索社区或标签，例如 #sonic #插画…" value="${esc(q)}"><button class="primary" onclick="renderCommunities(document.querySelector('#communitySearch').value.replace(/^#/,''))">搜索</button></div>${d.communities.length?`<div class="grid">${d.communities.map(communityCard).join('')}</div>`:empty('社区花园还没有住客','创建第一个社区，并添加标签让大家找到它。',me?`<button class="primary" onclick="openCommunityModal()">创建第一个社区</button>`:`<button class="primary" onclick="openAuth()">登录后创建社区</button>`)}</section>`;$('#communitySearch').addEventListener('keydown',e=>{if(e.key==='Enter')renderCommunities(e.target.value.replace(/^#/,''))})}
async function openCreator(username){try{const d=await api('/api/creator/'+encodeURIComponent(username));page='profile';setActive();const u=d.creator;$('#main').innerHTML=`<section class="page"><div class="profile-banner"><div class="creator-top">${avatar(u)}<div><div class="handle">@${esc(u.username)}</div><h1>${esc(u.displayName)}</h1></div></div><p>${esc(u.bio||'这个创作者还没有填写简介。')}</p><div class="tags">${tags(u.tags)}</div><div class="profile-actions"><button class="primary" onclick="openDonate('${esc(u.username)}')">♡ 支持这位创作者</button>${me?.username===u.username?'<button class="outline" onclick="openProfileModal()">编辑主页</button>':''}<button class="outline" onclick="go('posts')">浏览作品</button></div></div><div class="section-head"><div><h2>作品</h2><p>${d.posts.length} 篇已发布的内容</p></div></div>${d.posts.length?`<div class="grid">${d.posts.map(postCard).join('')}</div>`:empty('还没有发布作品','创作者的第一篇作品会出现在这里。')}</section>`;}catch(e){toast(e.message,true)}}
async function renderDashboard(){page='dashboard';setActive();if(!me){$('#main').innerHTML=`<section class="page">${empty('登录后进入工作台','管理个人主页、发布作品，并查看打赏意向记录。',`<button class="primary" onclick="openAuth()">登录 / 注册</button>`)}</section>`;return}const d=await api('/api/dashboard');$('#main').innerHTML=`<section class="page"><h1 class="page-title">创作者工作台</h1><p class="sub">你好，${esc(me.displayName)}。这里管理你的小小创作空间。</p><div class="dash-stats"><div class="stat"><b>${d.posts.length}</b><span>已发布作品</span></div><div class="stat"><b>${d.communities.length}</b><span>创建的社区</span></div><div class="stat"><b>${d.donations.length}</b><span>打赏意向记录</span></div></div><div class="tabs"><button class="active" onclick="dashTab('overview',this)">总览</button><button onclick="dashTab('profile',this)">个人主页</button><button onclick="dashTab('posts',this)">作品管理</button><button onclick="dashTab('donations',this)">打赏记录</button><button onclick="dashTab('communities',this)">我的社区</button></div><div id="dashPanel"><div class="two-col"><div class="card"><h3>我的主页</h3><p class="small">公开主页地址</p><p><a href="#creator/${esc(me.username)}" onclick="openCreator('${esc(me.username)}');return false" style="color:#c34f69">打开 /creator/${esc(me.username)} ↗</a></p><button class="outline" onclick="openProfileModal()">编辑资料</button></div><div class="card"><h3>快速开始</h3><p class="small">发布作品或创建社区，让主页慢慢丰富起来。</p><div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" onclick="openPostModal()">＋ 发布作品</button><button class="outline" onclick="openCommunityModal()">＋ 创建社区</button></div></div></div><div class="note" style="margin-top:16px">支付提示：当前版本只记录打赏意向，不会处理真实付款。请勿将意向记录当作到账凭证。</div></div></section>`;window.dashData=d}
function dashTab(tab,btn){$$('.tabs button').forEach(x=>x.classList.toggle('active',x===btn));const d=window.dashData||{};const panel=$('#dashPanel');if(tab==='overview'){panel.innerHTML=`<div class="two-col"><div class="card"><h3>我的主页</h3><p class="small">公开主页地址</p><p><a style="color:#c34f69" href="#creator/${esc(me.username)}" onclick="openCreator('${esc(me.username)}');return false">打开个人主页 ↗</a></p><button class="outline" onclick="openProfileModal()">编辑资料</button></div><div class="card"><h3>快速开始</h3><button class="primary" onclick="openPostModal()">＋ 发布作品</button> <button class="outline" onclick="openCommunityModal()">＋ 创建社区</button></div></div>`}else if(tab==='profile'){panel.innerHTML=`<div class="card form-card"><h3>个人主页资料</h3><p class="small">编辑公开显示的创作者信息。</p><button class="primary" onclick="openProfileModal()">编辑个人主页</button></div>`}else if(tab==='posts'){panel.innerHTML=d.posts?.length?`<div class="card">${d.posts.map(p=>`<div class="record"><div><b>${esc(p.title)}</b><small>${fmtDate(p.createdAt)} · ${tags(p.tags)}</small></div></div>`).join('')}<button class="primary" style="margin-top:14px" onclick="openPostModal()">＋ 发布作品</button></div>`:empty('还没有作品','发布后，你的作品会显示在这里。',`<button class="primary" onclick="openPostModal()">发布作品</button>`)}else if(tab==='donations'){panel.innerHTML=`<div class="note" style="margin-bottom:12px">这些是打赏意向，不代表真实支付已到账。接入正式支付渠道后，才能可靠自动核验。</div>`+(d.donations?.length?`<div class="card">${d.donations.map(x=>`<div class="record"><div><b>¥${Number(x.amount).toFixed(2)} · ${esc(x.supporterName)}</b><small>${esc(x.message||'没有留言')} · ${fmtDate(x.createdAt)}</small></div><span class="pill">${x.status==='manually_reviewed'?'已人工查看':'待付款 / 未验证'}</span></div>`).join('')}</div>`:empty('还没有打赏记录','有人发起打赏后，记录会显示在这里。'))}else if(tab==='communities'){panel.innerHTML=d.communities?.length?`<div class="grid">${d.communities.map(communityCard).join('')}</div>`:empty('你还没有创建社区','给同好建一个小小的聚集地。',`<button class="primary" onclick="openCommunityModal()">创建社区</button>`)}}
function modal(title,body){$('#modalRoot').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><section class="modal"><div class="modal-head"><h2>${title}</h2><button class="close" onclick="closeModal()">×</button></div>${body}</section></div>`}function closeModal(){$('#modalRoot').innerHTML=''}
function openAuth(mode='login'){modal('欢迎来到 bloom',`<div class="tabs" style="margin-top:0"><button class="${mode==='login'?'active':''}" onclick="openAuth('login')">登录</button><button class="${mode==='register'?'active':''}" onclick="openAuth('register')">创建账号</button></div><form id="authForm" class="form-stack"><div><label class="label">用户名</label><input name="username" required minlength="3" maxlength="28" placeholder="例如 yunonn" autocomplete="username"></div>${mode==='register'?'<div><label class="label">显示名称</label><input name="displayName" maxlength="40" placeholder="大家会怎样称呼你"></div>':''}<div><label class="label">密码</label><input name="password" type="password" required minlength="8" placeholder="至少 8 位" autocomplete="${mode==='login'?'current-password':'new-password'}"></div><button class="primary" type="submit">${mode==='login'?'登录':'创建账号并进入'}</button><p class="small">这是本地 MVP。请勿使用你在其他网站使用的真实密码。</p></form>`);$('#authForm').onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target);try{const d=await api('/api/'+(mode==='login'?'login':'register'),{method:'POST',body:JSON.stringify(Object.fromEntries(f))});me=d.user;closeModal();updateAuthButton();toast(mode==='login'?'登录成功':'账号创建成功');go('dashboard')}catch(err){toast(err.message,true)}}}
function startCreate(){if(me){openProfileModal()}else openAuth('register')}
function openPostModal(){if(!me)return openAuth();api('/api/communities').then(d=>{modal('发布一篇作品',`<form id="postForm" class="form-stack"><div><label class="label">标题</label><input name="title" required maxlength="100" placeholder="这次想分享什么？"></div><div><label class="label">正文</label><textarea name="body" required maxlength="5000" placeholder="记录你的灵感、创作过程或作品说明…"></textarea></div><div><label class="label">标签（用空格或逗号分隔）</label><input name="tags" placeholder="插画 Sonic 同人"></div><div><label class="label">发布到社区（可选）</label><select name="communityId"><option value="">不加入社区</option>${d.communities.map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></div><button class="primary" type="submit">发布作品</button></form>`);$('#postForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/posts',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('作品已发布');go('dashboard')}catch(err){toast(err.message,true)}}}).catch(e=>toast(e.message,true))}
function openCommunityModal(){if(!me)return openAuth();modal('创建一个社区',`<form id="communityForm" class="form-stack"><div><label class="label">社区名称</label><input name="name" required maxlength="50" placeholder="例如：Sonic 同人花园"></div><div><label class="label">社区介绍</label><textarea name="description" required maxlength="300" placeholder="这里欢迎什么样的创作和讨论？"></textarea></div><div><label class="label">关联标签（至少一个）</label><input name="tags" required placeholder="Sonic 同人 插画"></div><div class="note">社区标签会用于搜索：搜索标签时，匹配的社区会出现。</div><button class="primary" type="submit">创建社区</button></form>`);$('#communityForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/communities',{method:'POST',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});closeModal();toast('社区创建成功');go('communities')}catch(err){toast(err.message,true)}}}
function openProfileModal(){if(!me)return openAuth();modal('编辑个人主页',`<form id="profileForm" class="form-stack"><div><label class="label">显示名称</label><input name="displayName" required maxlength="40" value="${esc(me.displayName)}"></div><div><label class="label">个人简介</label><textarea name="bio" maxlength="300">${esc(me.bio||'')}</textarea></div><div><label class="label">头像图片 URL（可选）</label><input name="avatar" type="url" value="${esc(me.avatar||'')}" placeholder="https://…"></div><div><label class="label">主页标签</label><input name="tags" value="${esc((me.tags||[]).join(' '))}" placeholder="插画 动画 Sonic"></div><div><label class="label">支持说明</label><textarea name="paymentNote" maxlength="300">${esc(me.paymentNote||'')}</textarea></div><button class="primary" type="submit">保存修改</button></form>`);$('#profileForm').onsubmit=async e=>{e.preventDefault();try{const d=await api('/api/profile',{method:'PATCH',body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});me=d.user;closeModal();updateAuthButton();toast('主页资料已保存');openCreator(me.username)}catch(err){toast(err.message,true)}}}
function openDonate(username){selectedAmount=5;modal('支持这位创作者',`<p class="small">你正在为 @${esc(username)} 创建一条打赏意向。当前版本没有接入真实支付。</p><form id="donateForm" class="form-stack"><label class="label">选择金额（人民币）</label><div class="amounts">${[5,10,20,50,100,200].map(n=>`<button class="amount ${n===5?'selected':''}" type="button" data-amount="${n}">¥${n}</button>`).join('')}</div><div><label class="label">自定义金额（¥）</label><input id="customAmount" type="number" min="1" max="100000" step="0.01" placeholder="也可以输入其他金额"></div><div><label class="label">你的称呼（可匿名）</label><input name="supporterName" maxlength="40" placeholder="匿名支持者"></div><div><label class="label">留言（可选）</label><textarea name="message" maxlength="300" placeholder="给创作者一点鼓励…"></textarea></div><div class="note">提交后只会保存待付款意向记录，不会扣款或自动确认到账。</div><button class="primary" type="submit">创建打赏意向</button></form>`);$$('[data-amount]').forEach(b=>b.onclick=()=>{selectedAmount=Number(b.dataset.amount);$('#customAmount').value='';$$('[data-amount]').forEach(x=>x.classList.toggle('selected',x===b))});$('#customAmount').oninput=()=>$$('[data-amount]').forEach(x=>x.classList.remove('selected'));$('#donateForm').onsubmit=async e=>{e.preventDefault();const amount=$('#customAmount').value?Number($('#customAmount').value):selectedAmount;const f=Object.fromEntries(new FormData(e.target));try{const d=await api('/api/donations',{method:'POST',body:JSON.stringify({...f,username,amount})});closeModal();modal('打赏意向已保存',`<div class="notice">${esc(d.notice)}</div><p>意向金额：<b>¥${amount.toFixed(2)}</b></p><p class="small">这不是支付成功凭证。要正式收款，需要先接入经批准的支付宝或微信支付渠道。</p><button class="primary" onclick="closeModal();openCreator('${esc(username)}')">返回创作者主页</button>`)}catch(err){toast(err.message,true)}}}
function updateAuthButton(){const b=$('#authButton');if(me){b.textContent='@'+me.username;b.onclick=()=>go('dashboard');}else{b.textContent='登录 / 注册';b.onclick=()=>openAuth()}}
$$('.nav [data-page]').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));$('#authButton').onclick=()=>openAuth();
(async()=>{try{const d=await api('/api/me');me=d.user;updateAuthButton();await loadHome()}catch(e){$('#main').innerHTML=empty('页面加载失败',e.message,`<button class="primary" onclick="location.reload()">重新加载</button>`)}})();
</script></body></html>
